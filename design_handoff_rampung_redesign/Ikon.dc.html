<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
{{ svg }}
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:24,&quot;height&quot;:24},&quot;n&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;users&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { html: null };
  componentDidMount() { this.load(); }
  componentDidUpdate(p) { if (p.n !== this.props.n) this.load(); }
  load() {
    const n = this.props.n || 'circle';
    const cache = window.__ikonCache || (window.__ikonCache = {});
    if (!cache[n]) cache[n] = fetch(`https://unpkg.com/lucide-static@0.469.0/icons/${n}.svg`).then(r => r.text())
      .then(t => t.replace(/width="24"/, 'width="100%"').replace(/height="24"/, 'height="100%"').replace(/<!--[\s\S]*?-->/g, ''));
    cache[n].then(html => { if ((this.props.n || 'circle') === n) this.setState({ html }); }).catch(() => {});
  }
  renderVals() {
    return { svg: React.createElement('span', { 'aria-hidden': 'true', style: { display: 'block', width: '100%', height: '100%', lineHeight: 0 }, dangerouslySetInnerHTML: { __html: this.state.html || '' } }) };
  }
}
</script>
</body>
</html>
